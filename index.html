<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sticky Wall</title>
    <link rel="icon" href="./assets/to-do-list.png" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    />
    <link rel="stylesheet" href="./css/bootstrap.min.css" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/notyf@3/notyf.min.css"
    />
    <link rel="stylesheet" href="./css/style.css" />
  </head>
  <body>
    <div
      class="container d-flex align-items-center justify-content-center mt-5"
    >
      <img class="me-2" src="./assets//to-do-list.png" alt="to do list" />
      <h1 class="fw-bold">Sticky Wall</h1>
    </div>
    <div class="container mt-5 d-flex justify-content-between">
      <div class="w-25">
        <div class="d-flex justify-content-between mb-1">
          <small>Progress</small>
          <small id="taskCount"></small>
        </div>

        <div class="progress" style="height: 8px">
          <div
            class="progress-bar bg-success"
            role="progressbar"
            style="width: 0%"
            aria-valuemin="0"
            aria-valuemax="1"
          ></div>
        </div>
      </div>
      <div>
        <select class="form-select" name="" id="sortList">
          <option selected value="All">All</option>
        </select>
      </div>
    </div>

    <div
      class="container my-3 border border-1 border-secondary rounded-2 p-4 text-dark"
    >
      <div class="row g-2 align-items-stretch">
        <div class="col-lg-4 col-sm-6 d-flex"></div>
      </div>
    </div>

    <!-- Add Modal -->
    <div
      class="modal fade"
      id="addTaskModal"
      tabindex="-1"
      aria-labelledby="exampleModalLabel"
    >
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header">
            <h1 class="modal-title fs-5" id="exampleModalLabel">Add Note</h1>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
              aria-label="Close"
            ></button>
          </div>
          <div class="modal-body">
            <form>
              <div class="mb-3">
                <label for="noteTitle" class="form-label">Note Title</label>
                <input
                  type="text"
                  class="form-control"
                  id="noteTitle"
                  placeholder="Enter note title"
                />
              </div>
              <div class="mb-3">
                <label for="noteBody" class="form-label">Note Content</label>
                <textarea
                  class="form-control"
                  id="noteBody"
                  rows="3"
                  placeholder="Enter note content"
                ></textarea>
              </div>
              <div class="mb-3">
                <label for="label" class="form-label fw-semibold">Label</label>
                <select id="label" class="form-select">
                  <option selected disabled>Choose label</option>
                </select>
              </div>
            </form>
          </div>
          <div class="modal-footer">
            <button
              type="button"
              class="btn btn-secondary"
              data-bs-dismiss="modal"
            >
              Close
            </button>
            <button type="button" id="addBtn" class="btn bg-danger-subtle">
              Add
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- Edit Modal -->
    <div
      class="modal fade"
      id="editModal"
      tabindex="-1"
      aria-labelledby="exampleModalLabel"
    >
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header">
            <h1 class="modal-title fs-5" id="exampleModalLabel">Edit Note</h1>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
              aria-label="Close"
            ></button>
          </div>
          <div class="modal-body">
            <form>
              <div class="mb-3">
                <label for="noteTitle" class="form-label">Note Title</label>
                <input
                  type="text"
                  class="form-control"
                  id="editTitle"
                  placeholder="Enter note title"
                />
              </div>
              <div class="mb-3">
                <label for="noteBody" class="form-label">Note Body</label>
                <textarea
                  class="form-control"
                  id="editBody"
                  rows="3"
                  placeholder="Enter note body"
                ></textarea>
              </div>
              <div class="mb-3">
                <label for="label" class="form-label fw-semibold">Label</label>
                <select id="editLabel" class="form-select">
                  <option selected disabled>Choose label</option>
                </select>
              </div>
            </form>
          </div>
          <div class="modal-footer">
            <button
              type="button"
              class="btn btn-secondary"
              data-bs-dismiss="modal"
            >
              Close
            </button>
            <button type="button" id="editBtn" class="btn bg-danger-subtle">
              save
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- dark mode btn -->
    <div class="darkBtn position-fixed">
      <button
        id="darkBtn"
        class="dark-toggle btn text-white fs-5 rounded-circle bg-black"
      >
        <i class="fa-solid fa-moon"></i>
      </button>
    </div>

    <script src="./js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/notyf@3/notyf.min.js"></script>
    <script src="./js/main.js"></script>
  </body>
</html>
