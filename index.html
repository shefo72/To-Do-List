<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sticky Wall</title>
    <link rel="icon" href="./assets/sticky-note.png" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    />
    <link rel="stylesheet" href="./css/bootstrap.min.css" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/notyf@3/notyf.min.css"
    />
    <link rel="stylesheet" href="./css/style.css" />
  </head>
  <body>
    <div class="container py-5">
      <div
        class="d-flex flex-wrap align-items-center justify-content-between gap-3"
      >
        <div class="d-flex align-items-center gap-3">
          <div
            class="bg-warning rounded-circle d-flex align-items-center justify-content-center shadow-sm"
            style="width: 50px; height: 50px"
          >
            <i class="fa-solid fa-note-sticky fs-3 text-white"></i>
          </div>
          <h1 class="fw-bold m-0 fs-2">Sticky Wall</h1>
        </div>

        <div class="flex-grow-1 mx-lg-5">
          <div class="d-flex justify-content-between mb-1 px-1">
            <small class="fw-semibold">Tasks Completed</small>
            <small class="fw-bold" id="taskCount">0/0</small>
          </div>
          <div class="progress" style="height: 10px">
            <div
              class="progress-bar"
              role="progressbar"
              style="width: 0%"
            ></div>
          </div>
        </div>

        <div class="d-flex gap-2" style="min-width: 300px">
          <div class="input-group">
            <input
              class="form-control me-2"
              id="searchBar"
              type="search"
              placeholder="Search"
              aria-label="Search"
            />
          </div>
          <select
            class="form-select w-auto"
            id="sortList"
            style="min-width: 120px"
          >
            <option selected value="All">All Tags</option>
          </select>
        </div>
      </div>
    </div>

    <div class="container py-5">
      <div class="row g-4 align-items-stretch"></div>
    </div>

    <!-- Add Modal -->
    <div
      class="modal fade"
      id="addTaskModal"
      tabindex="-1"
      aria-labelledby="exampleModalLabel"
    >
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header">
            <h1 class="modal-title fs-5" id="exampleModalLabel">Add Note</h1>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
              aria-label="Close"
            ></button>
          </div>
          <div class="modal-body">
            <form id="addForm">
              <div class="mb-3">
                <label for="noteTitle" class="form-label">Note Title</label>
                <input
                  type="text"
                  class="form-control"
                  id="noteTitle"
                  placeholder="Enter note title"
                />
              </div>
              <div class="mb-3">
                <label for="noteBody" class="form-label">Note Content</label>
                <textarea
                  class="form-control"
                  id="noteBody"
                  rows="3"
                  placeholder="Enter note content"
                ></textarea>
              </div>
              <div class="mb-3">
                <label for="label" class="form-label fw-semibold">Label</label>
                <select id="label" class="form-select">
                  <option selected disabled>Choose label</option>
                </select>
              </div>
              <div id="inputLabel" class="mb-3"></div>
            </form>
          </div>
          <div class="modal-footer">
            <button
              type="button"
              class="btn btn-secondary"
              data-bs-dismiss="modal"
              id="closeFormBtn"
            >
              Close
            </button>
            <button type="button" id="addBtn" class="btn bg-danger-subtle">
              Add
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- Edit Modal -->
    <div
      class="modal fade"
      id="editModal"
      tabindex="-1"
      aria-labelledby="exampleModalLabel"
    >
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header">
            <h1 class="modal-title fs-5" id="exampleModalLabel">Edit Note</h1>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
              aria-label="Close"
            ></button>
          </div>
          <div class="modal-body">
            <form>
              <div class="mb-3">
                <label for="noteTitle" class="form-label">Note Title</label>
                <input
                  type="text"
                  class="form-control"
                  id="editTitle"
                  placeholder="Enter note title"
                />
              </div>
              <div class="mb-3">
                <label for="noteBody" class="form-label">Note Body</label>
                <textarea
                  class="form-control"
                  id="editBody"
                  rows="3"
                  placeholder="Enter note body"
                ></textarea>
              </div>
              <div class="mb-3">
                <label for="label" class="form-label fw-semibold">Label</label>
                <select id="editLabel" class="form-select">
                  <option selected disabled>Choose label</option>
                </select>
              </div>
            </form>
          </div>
          <div class="modal-footer">
            <button
              type="button"
              class="btn btn-secondary"
              data-bs-dismiss="modal"
            >
              Close
            </button>
            <button type="button" id="editBtn" class="btn bg-danger-subtle">
              save
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- dark mode btn -->
    <div class="darkBtn position-fixed">
      <button
        id="darkBtn"
        class="dark-toggle btn text-white fs-5 rounded-circle bg-black"
      >
        <i class="fa-solid fa-moon"></i>
      </button>
    </div>

    <script src="./js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/notyf@3/notyf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@latest/Sortable.min.js"></script>
    <script src="./js/main.js"></script>
  </body>
</html>
